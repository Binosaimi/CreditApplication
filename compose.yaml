services:
  credit.customers:
    image: credit.customers
    build:
      context: .
      dockerfile: credit.customers/Dockerfile
    ports:
      - "5101:8080"

  credit.loans:
    image: credit.loans
    build:
      context: .
      dockerfile: credit.loans/Dockerfile
    ports:
      - "5102:8080"

  credit.identity:
    image: credit.identity
    build:
      context: .
      dockerfile: credit.identity/Dockerfile
    ports:
      - "5103:8080"
    
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    
volumes:
  postgres-data: